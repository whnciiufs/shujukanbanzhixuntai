<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑手实时出勤看板</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#0f172a;color:#e2e8f0;height:100vh;display:flex;align-items:center;justify-content:center}
  #gate{text-align:center;padding:24px}
  #gate .t{font-size:18px;margin-bottom:6px}
  #gate .s{color:#94a3b8;margin-bottom:16px;font-size:13px}
  #pw{padding:11px 13px;border-radius:9px;border:1px solid #334155;background:#1e293b;
      color:#e2e8f0;font-size:15px;width:260px;outline:none}
  #pw:focus{border-color:#3b7ddd}
  button{margin-top:16px;padding:11px 26px;border:0;border-radius:9px;background:#3b7ddd;
         color:#fff;font-size:15px;cursor:pointer}
  button:active{transform:translateY(1px)}
  #err{color:#f87171;margin-top:14px;font-size:13px;min-height:18px}
  #viewer{display:none;width:100vw;height:100vh;background:#fff}
  #viewer iframe{width:100%;height:100%;border:0;display:block}
  /* 刷新状态提示：让「是否在自动更新」一眼可见，避免误以为卡住 */
  #upd{position:fixed;right:14px;bottom:14px;z-index:99;background:rgba(15,23,42,.82);
       color:#e2e8f0;font-size:12px;padding:5px 11px;border-radius:14px;
       opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body>
<div id="gate">
  <div class="t">🔒 骑手实时出勤看板</div>
  <div class="s">请输入查看密码</div>
  <div><input id="pw" type="password" placeholder="查看密码"
       onkeydown="if(event.key==='Enter')unlock()"></div>
  <button id="enter-btn" onclick="unlock()">进入看板</button>
  <div id="err"></div>
</div>
<div id="viewer"></div>
<div id="upd"></div>
<script>
window.__BOARD_ENC__=null;
window.__BOARD_ENC_ERR__=null;
window.__BOARD_URL__="https://shujukanbanzhixingtai.oss-cn-hangzhou.aliyuncs.com/boards/rider/board.enc.js";
window.__BOARD_VER__=null;
function __encSrc(){var u=window.__BOARD_URL__;return u+(u.indexOf('?')>=0?'&':'?')+'v='+Date.now();}
function __loadEnc(){
  return new Promise(function(res,rej){
    window.__BOARD_ENC__=null;
    var s=document.createElement("script");
    s.src=__encSrc();
    var done=false;
    s.onload=function(){ if(done)return; done=true;
      if(window.__BOARD_ENC__!==null&&window.__BOARD_ENC__!==undefined) res(window.__BOARD_ENC__);
      else rej(new Error(window.__BOARD_ENC_ERR__||"密文为空")); };
    s.onerror=function(){ if(done)return; done=true; rej(new Error("无法下载看板数据（网络错误）")); };
    document.head.appendChild(s);
    setTimeout(function(){ if(!done){done=true; rej(new Error("加载超时"));} },30000);
  });
}
function __verSrc(){var u=window.__BOARD_URL__.replace(/board\.enc\.js$/,'board.version');return u+(u.indexOf('?')>=0?'&':'?')+'v='+Date.now();}
function __checkVer(){
  return new Promise(function(res){
    var s=document.createElement('script');
    s.src=__verSrc();
    var done=false;
    s.onload=function(){ if(done)return; done=true; res(window.__BOARD_VER__); };
    s.onerror=function(){ if(done)return; done=true; res(null); };
    document.head.appendChild(s);
  });
}
</script>
<script>
const SALT=new TextEncoder().encode("rider-board-static-v1");
const ITERS=100000;
let __PW__="";
let __LAST_VER__=null;
// 密码只存在内存变量 __PW__ 里，**不落盘、不进 sessionStorage**：
//   · 切到后台再切回来 → 内存还在 → 自动刷新，不用重新输密码；
//   · 按 F5 刷新 / 重新打开链接 → 页面重载、内存清空 → 回到密码门，需要重新输入。
// 这既保留了日常查看的便利，又不会把看板密码长期留在同事电脑上。
function __loadEncText(){
  if(window.__BOARD_URL__){ return __loadEnc(); }
  if(window.__BOARD_ENC__!==null && window.__BOARD_ENC__!==undefined) return Promise.resolve(window.__BOARD_ENC__);
  return new Promise(function(res,rej){
    var t=setInterval(function(){
      if(window.__BOARD_ENC__!==null && window.__BOARD_ENC__!==undefined){clearInterval(t);res(window.__BOARD_ENC__);}
    },80);
    setTimeout(function(){clearInterval(t);rej(new Error("加载超时"));},30000);
  });
}
async function __gunzip(u8){
  // 浏览器原生解压：DecompressionStream('gzip')（Chrome 80+/Edge/Safari 16.4+）
  var ds=new DecompressionStream('gzip');
  var stream=new Blob([u8]).stream().pipeThrough(ds);
  var buf=await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function __render(txt, silent){
  const err=document.getElementById('err');
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(__PW__),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:SALT,iterations:ITERS,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    // 密文可能带 'z' 前缀 = gzip 压缩过（体积降到 ~1/8）；旧密文无前缀直接解
    var isZip = txt.charAt(0)==='z';
    var payload = isZip ? txt.slice(1) : txt;
    const parts=payload.split("|");
    if(parts.length!==2)throw new Error("bad format");
    const nonce=Uint8Array.from(atob(parts[0]),c=>c.charCodeAt(0));
    const ct=Uint8Array.from(atob(parts[1]),c=>c.charCodeAt(0));
    var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct);
    if(isZip) plain=await __gunzip(plain);
    const html=new TextDecoder().decode(plain);
    const v=document.getElementById('viewer');
    let f=v.querySelector('iframe');
    if(!f){ f=document.createElement('iframe'); v.appendChild(f); }
    f.style.width='100%';f.style.height='100%';f.style.border='0';
    f.srcdoc=html;
    document.getElementById('gate').style.display='none';
    v.style.display='block';
  }catch(e){
    // ⚠ 区分「密码不对」与「数据格式/版本不匹配」：
    //   发布过程中可能短暂出现「新版入口页 + 旧格式密文」，此时 AES 解密会失败，
    //   但不是密码错。此时自动重新拉一次密文（带新的时间戳绕开缓存）再试。
    var msg = (e && e.name) || '';
    if(msg==='OperationError'||msg==='DataError'||msg==='NotSupportedError'){
      if(!silent){
        try{
          await new Promise(function(r){ setTimeout(r, 800); });
          var retry = await __loadEncText();
          await __render(retry, false);
          return;
        }catch(e2){ /* 重试仍失败 → 落到下面的提示 */ }
      }
    }
    if(silent){ if(err) err.textContent='（后台刷新失败，仍显示上次数据）'; }
    else { if(err) err.textContent = (msg==='OperationError'||msg==='DataError')
        ? '数据校验失败，正在重试…若持续失败请刷新页面'
        : '密码不正确，请重新输入'; }
  }
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  if(!pw){err.textContent='请输入密码';return;}
  err.textContent='校验中…';
  let txt;
  try{
    txt=await __loadEncText();
  }catch(e){
    err.textContent='无法下载看板数据（网络错误或文件已被清理），请稍后重试';
    return;
  }
  __PW__=pw;
  await __render(txt, false);
  const v=document.getElementById('viewer');
  if(v.style.display==='block'){
    try{ __LAST_VER__=await __checkVer(); }catch(e){}
    __startRefreshTimer();
    __upd('已更新 ' + new Date().toTimeString().slice(0,5));
  }else{
    // 解密失败（密码错）→ 清掉内存里的密码，避免后续自动刷新一直用错密码
    __PW__="";
    var e2=document.getElementById('err');
    if(e2 && !e2.textContent) e2.textContent='密码不正确，请重新输入';
  }
}
// ---- 自动刷新：前台每 5 秒查一次版本；后台降到每 60 秒（只拉 32 字节版本号，成本可忽略）----
// 为什么后台还要查：早期版本切到后台就完全停表，用户切回来那一刻仍看到旧数据，
// 容易误判成「看板不刷新了」。现在后台仍每分钟探一次，只是不下载大密文，
// 只在页脚提示「有新数据」；切回前台的瞬间立刻渲染，体感是即时的。
function __upd(t, hold){
  var d=document.getElementById('upd'); if(!d) return;
  d.textContent=t; d.style.opacity=1;
  clearTimeout(window.__UPD_T__);
  if(hold!==0) window.__UPD_T__=setTimeout(function(){ d.style.opacity=0; }, hold||2600);
}
function __setTimer(ms){
  __stopRefreshTimer();
  window.__REFRESH_TIMER__=setInterval(autoRefresh, ms);
}
function __startRefreshTimer(){
  if(window.__REFRESH_TIMER__) return;
  __setTimer(document.hidden?60000:5000);
}
function __stopRefreshTimer(){
  if(window.__REFRESH_TIMER__){
    clearInterval(window.__REFRESH_TIMER__);
    window.__REFRESH_TIMER__=null;
  }
}
document.addEventListener('visibilitychange', function(){
  if(!__PW__) return;                       // 还没进入看板，不管
  // 前台 5 秒一查；后台 60 秒一查（不下载密文，只标记「有新数据」）
  __setTimer(document.hidden?60000:5000);
  if(!document.hidden) autoRefresh();       // 回到前台：立刻检查并渲染，无需重新输密码
});
// 页面被关闭/重载时也停表，避免残留定时器
window.addEventListener('pagehide', __stopRefreshTimer);
window.addEventListener('beforeunload', __stopRefreshTimer);
async function autoRefresh(){
  if(!__PW__) return;
  try{
    var ver=await __checkVer();
    if(!ver || ver===__LAST_VER__) return;
    if(document.hidden){                    // 后台：只提示，不下载不渲染（省流量/CPU）
      __upd('有新数据 · 切回即刷新', 0);
      return;
    }
    __upd('更新中…', 0);
    __LAST_VER__=ver;
    const txt=await __loadEncText();
    await __render(txt, true);
    __upd('已更新 ' + new Date().toTimeString().slice(0,5));
  }catch(e){ /* 静默失败，保留上次数据 */ }
}
// 页面加载时不做任何自动进入：密码只在内存里，刷新(F5)/重开链接都要重新输入。
// 若浏览器里还残留上一版写入的 sessionStorage 密码，这里顺手清掉（旧版本遗留）。
try{ sessionStorage.removeItem('rider_board_pw'); }catch(e){}
</script>
</body></html>
